[package]
name = "spacy-bench"
version = "0.1.0"
edition = "2021"
description = "Parity benchmark: spacy-rs vs spaCy 3.8.15 (speed + memory over the shared golden corpus fixture)"

# Standalone workspace on purpose: this is a benchmark tool, not a member of the
# monorepo workspace, so `cargo build --workspace` / `make test` never touch it.
[workspace]

[dependencies]
spacy-rs = { path = "../../../src/spacy-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"