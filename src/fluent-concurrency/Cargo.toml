[package]
name = "fluent-concurrency"
version.workspace = true
edition.workspace = true
autotests = false

[features]
default = ["db"]
# The `db` feature pulls in the pooled-database surface. It is default-on so
# existing consumers keep working; `--no-default-features` builds the pool /
# batch / scope / queue primitives with zero database weight.
db = ["dep:fluent-db", "fluent-db/sqlite"]

[dependencies]
tokio = { workspace = true }
fluent-wvr = { path = "../fluent-wvr" }
fluent-dag = { path = "../dag" }
fluent-db = { path = "../db", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
bon = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
common-core = { path = "../common-core" }
lru = { workspace = true }
fastrand = { workspace = true }
internment = { workspace = true, features = ["arc", "serde"] }
futures-util = { workspace = true }
bytes = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
fluent-wvr-testutil = { path = "../fluent-wvr-testutil" }

[lints]
workspace = true
