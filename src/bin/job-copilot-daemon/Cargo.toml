[package]
name = "job-copilot-daemon"
version.workspace = true
edition.workspace = true
description = "Local-only human-in-the-loop job application copilot daemon"

[[bin]]
name = "job-copilot-daemon"
path = "src/main.rs"

[dependencies]
job-copilot        = { path = "../../job-copilot" }
common-core        = { path = "../../common-core" }
clap               = { workspace = true, features = ["derive"] }
serde              = { workspace = true }
serde_json         = { workspace = true }
tokio              = { workspace = true, features = ["rt-multi-thread", "net", "sync", "macros", "io-util", "signal"] }
tracing            = { workspace = true }
tracing-subscriber = "0.3"

[lints]
workspace = true
