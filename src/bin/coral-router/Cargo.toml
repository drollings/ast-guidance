[package]
name = "coral-router"
version.workspace = true
edition.workspace = true

[dependencies]
fluent-db = { path = "../../db" }
# `fluent-onnx` is optional and entirely absent from default builds (its
# config / registry / trait surface now lives in `fluent-llm`); `ort` /
# `tokenizers` arrive only via the `onnx` feature below.
fluent-router = { path = "../../router", default-features = false }
fluent-concept = { path = "../../concept" }
fluent-onnx = { path = "../../fluent-onnx", default-features = false, optional = true }
fluent-types = { path = "../../types" }
fluent-concurrency = { path = "../../fluent-concurrency" }
common-core = { path = "../../common-core" }
fluent-llm = { path = "../../llm" }
coral-context = { path = "../../coral" }
guidance-ontology = { path = "../../ontology" }
guidance-rdf = { path = "../../rdf" }
spacy-rs = { path = "../../spacy-rs" }
clap = { workspace = true, features = ["derive"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"

[features]
# Opt-in: `--features onnx` pulls `ort` + `tokenizers` via `fluent-onnx/onnx`
# and enables the router's onnx wiring. The default binary is ort-free
# (onnx-declared models fail open to plain HTTP entries with a loud warning).
default = []
onnx = ["fluent-router/onnx", "dep:fluent-onnx", "fluent-onnx/onnx"]
