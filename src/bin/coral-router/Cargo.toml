[package]
name = "coral-router"
version.workspace = true
edition.workspace = true

[dependencies]
fluent-db = { path = "../../db" }
fluent-router = { path = "../../router" }
fluent-onnx = { path = "../../fluent-onnx" }
fluent-types = { path = "../../types" }
fluent-concurrency = { path = "../../fluent-concurrency" }
common-core = { path = "../../common-core" }
fluent-llm = { path = "../../llm" }
coral-context = { path = "../../coral" }
guidance-ontology = { path = "../../ontology" }
guidance-rdf = { path = "../../rdf" }
spacy-rs = { path = "../../spacy-rs" }
clap = { workspace = true, features = ["derive"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"

[features]
default = ["onnx"]
onnx = ["fluent-router/onnx", "fluent-onnx/onnx"]
