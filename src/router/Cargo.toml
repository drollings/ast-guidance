[package]
name = "fluent-router"
autotests = false
autobenches = false
version.workspace = true
edition.workspace = true

[dependencies]
fluent-wvr = { path = "../fluent-wvr" }
fluent-concurrency = { path = "../fluent-concurrency" }
common-core = { path = "../common-core", features = ["sqlite"] }
fluent-types = { path = "../types" }
fluent-llm = { path = "../llm" }
fluent-dag = { path = "../dag" }
fluent-db = { path = "../db" }
# The shared `LlmWeights`/`LlmContext`/`LlmKVCache` contracts in
# `fluent-llm::runtime` are `#[async_trait]` traits; the fleet adapters
# (`instances/traits.rs`, `ort.rs`) implement them.
async-trait = { workspace = true }
# Milestone 6: DEP-as-routing-signal extraction + the NlpStage that runs the
# deterministic NLP pipeline on inbound natural-language requests.
spacy-rs = { path = "../spacy-rs" }
# M3 (spacy-rs split): the neutral ConceptStore/TaxonomyHierarchy home.
fluent-concept = { path = "../concept" }
# Ort-free by default: `fluent-onnx` is optional and entirely absent from
# default builds (its config / registry / trait surface now lives in
# `fluent-llm`). The `ort`/`tokenizers` workers only build with the `onnx`
# feature below, so a default Coral Router build contains neither `ort` nor
# `fluent-onnx`.
fluent-onnx = { path = "../fluent-onnx", default-features = false, optional = true }
fluent-wvr-testutil = { path = "../fluent-wvr-testutil" }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
lru = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
time = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
rusqlite = { workspace = true }
minijinja = { workspace = true }
search-vector = { path = "../search-vector" }
bitvec = { workspace = true }
internment = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# The onnx wiring (registry build at boot, encoder/overlay workers) is gated on
# the same feature as fluent-onnx's, so a default build is ort-free and runs
# deterministically: onnx-declared models degrade to plain HTTP entries with a
# loud warning (fail-open). Opt in with `--features onnx` (pulls `ort` +
# `tokenizers` via `fluent-onnx/onnx`).
default = []
onnx = ["dep:fluent-onnx", "fluent-onnx/onnx"]
live-ai = []

[[test]]
name = "liveness_calibration"
path = "tests/liveness_calibration.rs"

[[test]]
name = "threshold_calibration"
path = "tests/threshold_calibration.rs"

[[test]]
name = "live"
path = "tests/live.rs"
required-features = ["live-ai"]

[lints]
workspace = true
