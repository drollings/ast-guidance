[workspace]
resolver = "2"
members = [
    "xtask",
    "src/fluent-wvr",
    "src/fluent-wvr-macros",
    "src/fluent-wvr-testutil",
    "src/fluent-concurrency",
    "src/llm",
    "src/bin/guidance",
    "src/bin/coral",
    "src/coral",
    "src/guidance",
    "src/dag",
    "src/types",
    "src/common-core",
    "src/content-node",
    "src/search-vector",
    "src/rdf",
    "src/ontology",
    "src/knowledge",
    "src/wasm_ipc",
    "src/memory-plugin",
    "src/router",
    "src/bin/coral-router",
    "src/bin/yamake-coral",
    "src/db",
    "src/spacy-rs",
    "src/fluent-onnx",
]

[workspace.package]
version = "0.2.0"
edition = "2021"

[workspace.dependencies]
# CLI & FS
clap = { version = "4", features = ["derive"] }
notify = "7"
blake3 = "1.8"

# Strings
smol_str = { version = "0.3", features = ["serde"] }
internment = { version = "0.8", features = ["arc", "serde"] }

# Data
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Builders
bon = "3"

# Templating
# minijinja is used by fluent-router's chart templates: charts need
# `{% for %}` / `{% if %}` over variable-length bound-entity lists (D1).
minijinja = "2"

# Database
rusqlite = { version = "0.34", features = ["bundled"] }
# sqlite-vec not yet available as a Rust crate; we use manual cosine fallback

# Orchestration
bitvec = "1"
extism = "1"
async-openai = "0.28"

# Parsing
tree-sitter = "0.25"
tree-sitter-zig = "1.1.2"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server", "http1"] }
http-body = "1"
http-body-util = { version = "0.1", features = ["channel"] }
http = "1"
bytes = "1"
futures-util = "0.3"


# Testing
tempfile = "3"
httpmock = "0.7"

# Randomness
fastrand = "2"

# ONNX / tokenizers (fluent-onnx). `ort` is the safe ONNX Runtime wrapper; the
# onnxruntime prebuilt binaries are fetched at build time via its
# `download-binaries` feature. `tokenizers` (HuggingFace) supplies the LFM
# tokenizer with char-offset output. Both are pinned here so every consumer
# builds the same version.
#
# `migraphx` enables `ort::ep::MIGraphX` — the AMD ROCm GPU execution provider
# (successor to the ROCm EP removed upstream in ORT 1.23) that the session
# loader uses for `execution_provider: "gpu"`. `load-dynamic` makes ort load the
# system onnxruntime dylib at runtime (via `ORT_DYLIB_PATH`, else
# `libonnxruntime.so`), which is how the MIGraphX-enabled ORT 1.28 build at
# `/lib64/libonnxruntime.so.1.28.0` is linked in for GPU inference; it also
# disables the CPU-prebuilt download, so the loader probes the linked runtime at
# load time and fails open to CPU with a loud warning when MIGraphX is absent.
ort = { version = "2.0.0-rc.13", features = ["migraphx", "load-dynamic"] }
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }

# Macros
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

# System
libc = "0.2"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
memmap2 = "0.9"
fs2 = "0.4"
time = "0.3"
regex = "1"
# Lookbehind-capable regex engine for the tokenizer's affix patterns
# (spacy/lang/punctuation.py uses `(?<=...)`), pure Rust, no unsafe.
fancy-regex = "0.14"
dashmap = "6"
lru = "0.13"
which = "4"
dirs = "6"
hnsw_rs = "0.3"
anndists = "0.1"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
large_stack_arrays = "allow"
case_sensitive_file_extension_comparisons = "allow"
zero_sized_map_values = "allow"
unnecessary_literal_bound = "allow"
cast_possible_wrap = "allow"
unreadable_literal = "allow"
similar_names = "allow"
single_char_pattern = "allow"
byte_char_slices = "allow"
manual_is_multiple_of = "allow"
too_many_arguments = "allow"
default_trait_access = "allow"
items_after_statements = "allow"
should_implement_trait = "allow"
